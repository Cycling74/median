[package]
name = "max-sys"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
build = "build.rs"
description = "sys bindings for the Cycling 74 Max SDK"
license-file = "LICENSE.md"

[lib]
# The generated documentation contains the SDK's C examples, not Rust doctests.
doctest = false

[features]
build-bindings = ["bindgen"]
default = []

[build-dependencies]
bindgen = { version = "=0.73.2",  optional = true }
