[package]
name = "median_macros"
version = "0.3.0-dev"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
quote = "1.0.7"
syn = { version = "3", features = ["full"] }
proc-macro2 = "1.0.24"

[dev-dependencies]
proc-macro2 = { version = "1.0.24", features = ["span-locations"] }
