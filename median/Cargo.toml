[package]
name = "median"
version = "0.2.0"
authors = ["Alex Norman <xnor@cycling74.com>"]
edition = "2018"
build = "build.rs"
license = "MIT"

[dependencies]
max-sys = { path = "../max-sys/" }
median_macros = { path = "../median_macros/" }
lazy_static = "1.4.0"
paste = "1.0.1"
field-offset = "0.3.2"
parking_lot = "0.11.0"

[build-dependencies]
quote = "1.0.7"
proc-macro2 = "1.0.24"
syn = "1.0.48"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
not_unsafe_ptr_arg_deref = "deny"
missing_safety_doc = "warn"
