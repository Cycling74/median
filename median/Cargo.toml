[package]
name = "median"
version = "0.3.0-dev"
authors = ["Alex Norman <xnor@cycling74.com>"]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[dependencies]
max-sys = { path = "../max-sys/" }
median_macros = { path = "../median_macros/" }
lazy_static = "1.4.0"
paste = "1.0.1"
parking_lot = "0.11.0"
rtrb = "0.4"

[dev-dependencies]
median-mock = { path = "../median-mock" }
trybuild = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
not_unsafe_ptr_arg_deref = "deny"
missing_safety_doc = "warn"
