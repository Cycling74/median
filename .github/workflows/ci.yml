name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  msrv:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Minimum Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      # Diagnostic snapshots follow stable and are tested in the platform matrix below.
      # Skip that UI runner here because its expected wording is compiler-specific.
      - name: Tests on minimum Rust
        run: cargo +1.85.0 test --workspace -- --skip macro_errors
      - name: Binding generator on minimum Rust
        run: cargo +1.85.0 check -p max-sys --features build-bindings
  test:
    strategy:
      fail-fast: false
      matrix:
        # Explicit architectures; macos-13 from the original plan is retired.
        os: [macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Rust toolchain
        run: rustup update stable --no-self-update
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
      - name: Build standalone externals
        shell: bash
        run: |
          set -e
          for example in simplemax simp simp_explicit hello_dsp multi jit_scalebias jit_gl_simple validation; do
            (cd "median/examples/$example" && cargo build)
          done
      - name: Install cargo-make
        run: cargo install cargo-make --version 0.37.24 --locked
      - name: Package simp
        working-directory: median/examples/simp
        run: cargo make package
      - name: Package validation fixtures
        working-directory: median/examples/validation
        run: cargo make package-fixtures
