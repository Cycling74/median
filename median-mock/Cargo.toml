[package]
name = "median-mock"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
build = "build.rs"
license.workspace = true
description = "A Rust test kernel that implements the subset of the Max C API used by median, so externals can be tested with cargo test"
publish = false

[dependencies]
parking_lot = "0.12.5"
max-sys = { path = "../max-sys" }

[build-dependencies]
cc = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
not_unsafe_ptr_arg_deref = "deny"
